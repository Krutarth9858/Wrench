[pytest]
testpaths = tests
asyncio_mode = auto

# All fixtures and tests share ONE event loop for the whole session.
# The SQLAlchemy async engine in app/db/session.py is module-level, so its
# asyncpg connections must not be created on one loop and reused on another.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
