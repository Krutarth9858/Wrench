# ==============================================================================
# Wrench — Nginx Virtual Host for nip.io Wildcard DNS (Zero-Domain Setup)
# Server Elastic IP: 13.202.225.48
# Domain: http://wrench.13.202.225.48.nip.io
# No domain purchase needed — routes standard Port 80 directly to Wrench!
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wrench.13.202.225.48.nip.io;

    client_max_body_size 25M;

    # WebSocket Proxy for Realtime updates
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8085/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API & Web Application
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
